# kind cluster config for Strata dev.
#
# One control-plane node. Port mappings expose the backend on the
# host so the local TUI can reach it without `kubectl port-forward`.
#
# Usage:
#   kind create cluster --config infra/kind/strata-dev.yaml
#   kind delete cluster --name strata-dev

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: strata-dev
nodes:
  - role: control-plane
    extraPortMappings:
      # Keycloak admin UI
      - containerPort: 30081
        hostPort: 8081
        protocol: TCP
      # Web (Next.js) — Phase 1+
      - containerPort: 30080
        hostPort: 3000
        protocol: TCP
      # Orchestrator (via Envoy Gateway, port 8443 in kind)
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 6444