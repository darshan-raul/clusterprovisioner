[project]
name = "strata-mcp-k8s"
version = "0.1.0"
description = "Strata MCP k8s server. FastMCP 3.x over streamable-HTTP."
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4",
    "httpx>=0.27,<0.29",
    "kubernetes==29.0.0",
    "pydantic>=2.7",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strata_mcp_k8s"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]