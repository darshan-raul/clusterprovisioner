{{- if .Values.orchestrator.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: strata
  labels:
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: strata
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: strata
  labels:
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: strata
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: orchestrator
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: strata
  labels:
    app.kubernetes.io/component: orchestrator
    app.kubernetes.io/part-of: strata
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/component: orchestrator
        app.kubernetes.io/part-of: strata
    spec:
      serviceAccountName: orchestrator
      containers:
        - name: orchestrator
          image: "{{ .Values.orchestrator.image.repository }}:{{ .Values.orchestrator.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DATABASE_URL
              value: "postgres://strata:strata-dev-password@postgres.strata.svc.cluster.local:5432/strata?sslmode=disable"
            {{- range $k, $v := .Values.orchestrator.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.orchestrator.bootstrapAdminToken }}
            - name: BOOTSTRAP_ADMIN_TOKEN
              value: {{ .Values.orchestrator.bootstrapAdminToken | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
{{- end }}