{{- /*
Phase 1 dev: a plain Postgres Deployment + Service. Phase 8 (real
EKS) replaces this with CloudNativePG for PITR + S3 backups.

The schema lives in store/migrations/0001_init.sql; the orchestrator
runs migrations at startup.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: strata-postgres
  namespace: strata
  labels:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: strata
type: Opaque
stringData:
  POSTGRES_DB: strata
  POSTGRES_USER: strata
  POSTGRES_PASSWORD: strata-dev-password
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: strata
  labels:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: strata
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: strata
  labels:
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: strata
spec:
  replicas: 1
  serviceName: postgres
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/component: postgres
        app.kubernetes.io/part-of: strata
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: strata-postgres
          ports:
            - name: pg
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            tcpSocket:
              port: pg
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: pg
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi